<svg width="1024" height="1024" viewBox="0 0 1024 1024" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#3b6fd4"/>
      <stop offset="1" stop-color="#1f3a78"/>
    </linearGradient>
    <linearGradient id="page" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffffff"/>
      <stop offset="1" stop-color="#e9eef9"/>
    </linearGradient>
  </defs>
  <!-- rounded background -->
  <rect x="0" y="0" width="1024" height="1024" rx="224" fill="url(#bg)"/>
  <!-- stacked document pages -->
  <g transform="translate(286 232)">
    <rect x="40" y="40" width="360" height="470" rx="34" fill="#9fb6e6" opacity="0.55"/>
    <rect x="20" y="20" width="360" height="470" rx="34" fill="#c7d6f2" opacity="0.8"/>
    <rect x="0" y="0" width="360" height="470" rx="34" fill="url(#page)"/>
    <!-- text lines -->
    <g fill="#9aa7c4">
      <rect x="48" y="70"  width="240" height="22" rx="11"/>
      <rect x="48" y="122" width="264" height="18" rx="9"/>
      <rect x="48" y="160" width="220" height="18" rx="9"/>
      <rect x="48" y="198" width="256" height="18" rx="9"/>
    </g>
  </g>
  <!-- magnifier representing semantic search -->
  <g transform="translate(545 545)">
    <circle cx="120" cy="120" r="150" fill="none" stroke="#ffffff" stroke-width="46"/>
    <circle cx="120" cy="120" r="150" fill="#3b6fd4" opacity="0.18"/>
    <!-- vector / similarity dots -->
    <circle cx="78"  cy="120" r="17" fill="#2e9e5b"/>
    <circle cx="138" cy="86"  r="17" fill="#f5a623"/>
    <circle cx="150" cy="158" r="17" fill="#e0556b"/>
    <line x1="78" y1="120" x2="138" y2="86" stroke="#ffffff" stroke-width="9" stroke-linecap="round"/>
    <line x1="78" y1="120" x2="150" y2="158" stroke="#ffffff" stroke-width="9" stroke-linecap="round"/>
    <rect x="214" y="214" width="170" height="60" rx="30" transform="rotate(45 214 214)" fill="#ffffff"/>
  </g>
</svg>
